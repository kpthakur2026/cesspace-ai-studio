<!doctype html><html><head><meta charset="utf-8"><title>CesSpace AI Studio Stage 1</title><style>body{font:16px system-ui;background:#111827;color:white;margin:30px}textarea{display:block;width:80%;height:110px;margin:20px 0;background:#29364c;color:white}button{padding:12px;cursor:pointer}iframe{display:block;background:white;border:0;margin-top:20px;width:95%;height:500px}</style></head><body><h1>CesSpace AI Studio — Prototype</h1><p>Developer-only demo. Real AI requires a server-side DeepSeek key. Offline mode is NOT AI-generated.</p><textarea id="prompt">A premium accounting firm website</textarea><button onclick="run(false)">DeepSeek generate</button><button onclick="run(true)">Offline demo</button><p id="status"></p><iframe sandbox="" title="Preview"></iframe><script>async function run(demo){const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.querySelector('#prompt').value,demo})});const j=await r.json();document.querySelector('#status').textContent=j.error||j.mode;if(j.html)document.querySelector('iframe').srcdoc=j.html}</script></body></html>
